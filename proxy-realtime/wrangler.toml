# Configurazione per chi pubblica il proxy con la riga di comando (npx wrangler deploy).
# Le credenziali NON vanno qui: si impostano con
#   npx wrangler secret put CLIENT_ID
#   npx wrangler secret put CLIENT_SECRET
name = "udr-realtime"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# agenzie delle UdR servite (vedi /agenzie con DEBUG = "1"); deve restare uguale a quanto impostato nel pannello
AGENCY_ID = "UdR11AirCampania,UdR10AutolineeTroiani,UdR2AutoserviziTroiani,BusInternationalService,UdR7AutoserviziTroiani,CSCMobilitaScarl"
ALLOWED_ORIGINS = "https://astral-spa.github.io,https://*.astralspa.it"
DEBUG = "0"
